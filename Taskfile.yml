version: '3'

vars:
  IMAGE: scipioit/clavis-trainer
  HOST: scipio@cubo.local
  REMOTE_DIR: clavis-trainer
  SHA:
    sh: git rev-parse --short=7 HEAD
  # versione se HEAD ha un tag vX.Y.Z (es. v0.2.0 → 0.2.0), altrimenti vuota
  VERSION:
    sh: git describe --tags --exact-match --match 'v*' 2>/dev/null | sed 's/^v//' || true

tasks:
  docker:build:
    desc: Costruisce l'immagine locale (esegue anche i test unitari)
    cmds:
      - docker build --build-arg VERSION={{if .VERSION}}{{.VERSION}}{{else}}sha-{{.SHA}}{{end}} -t {{.IMAGE}}:sha-{{.SHA}} -t {{.IMAGE}}:latest .

  docker:run:
    desc: Avvia l'immagine locale su http://localhost:8088
    deps: [docker:build]
    cmds:
      - docker rm -f clavis-trainer-local 2>/dev/null || true
      - docker run -d --name clavis-trainer-local -p 8088:8080 -e TELEGRAM_FAKE=1 -e COOKIE_SECURE=0 -e PUBLIC_URL=http://localhost:8088 {{.IMAGE}}:latest

  e2e:
    desc: Smoke test, account (bot finto) e profili contro l'immagine locale (porta 8088)
    deps: [docker:run]
    cmds:
      - sleep 2
      - bun tests/e2e/smoke.ts http://localhost:8088/
      - bun tests/e2e/account.ts http://localhost:8088/
      - bun tests/e2e/profiles.ts http://localhost:8088/
      - bun tests/e2e/guide.ts http://localhost:8088/

  docker:publish:
    desc: Rilascio manuale su Docker Hub (sha-<commit>, latest e la versione se HEAD ha un tag vX.Y.Z)
    preconditions:
      - sh: git diff --quiet && git diff --cached --quiet
        msg: Ci sono modifiche non committate, il tag sha-{{.SHA}} non corrisponderebbe al codice
    deps: [docker:build]
    cmds:
      - docker push {{.IMAGE}}:sha-{{.SHA}}
      - docker push {{.IMAGE}}:latest
      - '{{if .VERSION}}docker tag {{.IMAGE}}:sha-{{.SHA}} {{.IMAGE}}:{{.VERSION}} && docker push {{.IMAGE}}:{{.VERSION}}{{end}}'

  deploy:install:
    desc: Copia compose e script su cubo, installa il cron di aggiornamento e avvia
    cmds:
      - ssh {{.HOST}} 'mkdir -p ~/{{.REMOTE_DIR}}'
      - scp deploy/docker-compose.yaml deploy/update.sh {{.HOST}}:{{.REMOTE_DIR}}/
      - ssh {{.HOST}} 'chmod +x ~/{{.REMOTE_DIR}}/update.sh'
      - >-
        ssh {{.HOST}} '(crontab -l 2>/dev/null | grep -v "{{.REMOTE_DIR}}/update.sh";
        echo "*/5 * * * * $HOME/{{.REMOTE_DIR}}/update.sh >> $HOME/{{.REMOTE_DIR}}/update.log 2>&1") | crontab -'
      - ssh {{.HOST}} '~/{{.REMOTE_DIR}}/update.sh'

  deploy:now:
    desc: Forza subito l'aggiornamento su cubo senza aspettare il cron
    cmds:
      - ssh {{.HOST}} '~/{{.REMOTE_DIR}}/update.sh && tail -3 ~/{{.REMOTE_DIR}}/update.log 2>/dev/null; true'

  deploy:rollback:
    desc: 'Fissa una versione: task deploy:rollback -- sha-abc1234 (poi task deploy:latest per tornare a latest)'
    cmds:
      - ssh {{.HOST}} 'cd ~/{{.REMOTE_DIR}} && touch .env && sed -i "/^CLAVIS_TAG=/d" .env && echo "CLAVIS_TAG={{.CLI_ARGS}}" >> .env && ./update.sh'

  deploy:latest:
    desc: Torna a seguire latest dopo un rollback
    cmds:
      - ssh {{.HOST}} 'cd ~/{{.REMOTE_DIR}} && touch .env && sed -i "/^CLAVIS_TAG=/d" .env && ./update.sh'

  deploy:files:
    desc: Aggiorna compose e update.sh su cubo (senza toccare .env e data/) e applica
    cmds:
      - scp deploy/docker-compose.yaml deploy/update.sh {{.HOST}}:{{.REMOTE_DIR}}/
      - ssh {{.HOST}} 'chmod +x ~/{{.REMOTE_DIR}}/update.sh && ~/{{.REMOTE_DIR}}/update.sh'

  server:e2e:
    desc: Server locale col bot finto sulla porta 8099 (per tests/e2e/account.ts)
    deps: []
    cmds:
      - bun run build
      - TELEGRAM_FAKE=1 COOKIE_SECURE=0 PORT=8099 PUBLIC_URL=http://localhost:8099 DATA_DIR=$(mktemp -d) STATIC_DIR=./dist bun server/main.ts

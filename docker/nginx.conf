server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Tutti i file hanno mtime 0 (layer riproducibili): ETag e Last-Modified
    # di nginx dipenderebbero solo dalla dimensione: niente ETag e niente 304.
    etag off;
    if_modified_since off;

    # nomi con hash (assets) o URL con ?v=<hash> (corpus): immutabili
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /corpus/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # la pagina si riscarica sempre (0,5 kB): un rilascio si vede al primo ricaricamento
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
